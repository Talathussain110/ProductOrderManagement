<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>Edit Product</title>
<link rel="stylesheet" href="/edit_product.css" />
</head>
<body>
	<div class="container">
		<h1>Edit Product</h1>

		<div th:unless="${message.empty}" class="message">
			<span th:text="${message}"></span>
		</div>

		<div th:if="${message.empty}">
			<form name="product_record" th:action="@{/products/save}"
				th:object="${product}" method="post" class="form">

				<input type="hidden" th:field="*{id}" />

				<p>
					<label for="name">Name:</label> <input type="text" id="name"
						th:field="*{name}" />
				</p>

				<p>
					<label for="price">Price</label> <input type="number" id="price"
						step="0.01" th:field="*{price}" />
				</p>

				<button type="submit" name="btn_submit" class="btn primary">
					Save</button>
			</form>
		</div>
	</div>
</body>
</html>
