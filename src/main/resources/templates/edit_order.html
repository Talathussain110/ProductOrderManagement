<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>Edit Order</title>
<link rel="stylesheet" href="/edit_order.css" />
</head>
<body>

	<div class="header">
		<img src="/logo.png" alt="Logo" class="logo" />
	</div>

	<div class="container">
		<h1 th:text="${pageTitle}">Order</h1>

		<div th:unless="${message.empty}" class="message">
			<span th:text="${message}"></span>
		</div>

		<div th:if="${message.empty}">
			<form name="order_record" th:action="@{/orders/save}"
				th:object="${order}" method="post" class="form">

				<input type="hidden" th:field="*{id}" />

				<p>
					<label for="orderDate">Order Date:</label> <input type="date"
						id="orderDate" name="orderDate"
						th:value="${#temporals.format(order.orderDate, 'yyyy-MM-dd')}"
						required />
				</p>

				<div id="products-container">
					<label for="products">Products:</label>

					<div class="product-row">
						<select id="products" name="products" class="product-select">
							<option value="" disabled selected>Select product</option>
							<option th:each="p : ${allProducts}" th:value="${p.id}"
								th:text="${p.name}"></option>
						</select>
					</div>
				</div>

				<button type="button" id="add-product-btn" class="btn secondary">
					+ Add product</button>

				<button type="submit" name="btn_submit" class="btn primary">
					Save</button>
			</form>
		</div>
	</div>


	<script>
		const addBtn = document.getElementById("add-product-btn");

		if (addBtn) {
			addBtn.addEventListener("click",
					function() {
						const container = document
								.getElementById("products-container");
						const firstRow = container
								.querySelector(".product-row");
						const newRow = firstRow.cloneNode(true);

						newRow.querySelector("select").selectedIndex = 0;
						container.appendChild(newRow);
					});
		}
	</script>

</body>
</html>
